name: npm publish (part of Release)

# Not a way to release anything. Release is the one button; this is a step inside it, named
# so the Actions sidebar says so. No dispatch and no tag trigger: every extra route is how a
# registry version ends up with no engine release behind it, or how someone publishes the
# packages while believing they cut a release.
#
# Re-running Release for the same version is safe, because publishing is skipped when the
# registry already serves it. Without that, a release whose npm step succeeded and whose
# `create-release` failed would wedge that version forever: no tag exists so Release will run
# again, and npm refuses to publish a version twice.
#
# The npm token lives in paritytech/npm_publish_automation, not here. This job builds, proves
# the tarballs are safe to publish, packs them, hands them over, then waits for the registry
# to actually serve the version.

on:
  workflow_call:
    inputs:
      version:
        description: "Version to publish. A leading `v` is stripped, so a release tag works."
        required: true
        type: string

jobs:
  # Cheap, and it decides whether the expensive job runs at all.
  check:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      skip: ${{ steps.live.outputs.skip }}
    steps:
      - name: Resolve the version
        id: version
        env:
          VERSION_IN: ${{ inputs.version }}
        run: |
          # Callers pass the release tag as-is, so accept `v0.2.0` and publish `0.2.0`.
          VERSION="${VERSION_IN#v}"
          # Refuse anything npm would reject, or that would publish a nonsense version.
          if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "not a semver version: '$VERSION'" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      # npm versions are immutable, so a re-run must not try to publish one twice. Half
      # published is a different thing entirely and needs a person: bump and re-release,
      # because the missing half can never be filled in under this version.
      - name: Already on the registry?
        id: live
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          live=0
          for pkg in @parity/ppn-network-config @parity/ppn; do
            if curl -sfo /dev/null "https://registry.npmjs.org/$pkg/$VERSION"; then
              live=$((live + 1))
            fi
          done
          case "$live" in
            0) echo "skip=false" >> "$GITHUB_OUTPUT"
               echo "Publishing $VERSION" ;;
            2) echo "skip=true" >> "$GITHUB_OUTPUT"
               echo "Both packages already serve $VERSION. Nothing to publish." ;;
            *) echo "::error::$live of 2 packages are at $VERSION. Release a new version."
               exit 1 ;;
          esac

  publish:
    needs: check
    if: ${{ needs.check.outputs.skip != 'true' }}
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.check.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      # The published tarballs must carry no deployment endpoint, and must carry the launchers
      # zombienet execs by path. Both are asserted by packing for real and reading the result,
      # so this gate has to pass before anything is handed to the publisher.
      - name: Verify the publish surface
        run: pnpm --filter @parity/ppn test

      - name: Set versions
        run: |
          for pkg in packages/network-config packages/cli; do
            (cd "$pkg" && npm pkg set version="$VERSION")
          done
          # The CLI's dependency on the library is `workspace:*`; `pnpm pack` below rewrites it
          # to the concrete version. npm would publish the protocol verbatim and every install
          # would fail with EUNSUPPORTEDPROTOCOL — which is why packing uses pnpm, not npm.

      - name: Pack
        run: |
          mkdir -p packs
          for pkg in packages/network-config packages/cli; do
            (cd "$pkg" && pnpm pack --pack-destination "$GITHUB_WORKSPACE/packs")
          done
          ls -ltr packs

      - uses: actions/upload-artifact@v4
        with:
          name: packages-${{ github.sha }}
          path: packs

      - name: Trigger npm_publish_automation
        uses: octokit/request-action@dad4362715b7fb2ddedf9772c8670824af564f0d # v2.4.0
        with:
          route: POST /repos/paritytech/npm_publish_automation/actions/workflows/publish.yml/dispatches
          ref: main
          inputs: '${{ format(''{{ "repo": "{0}", "run_id": "{1}" }}'', github.repository, github.run_id) }}'
        env:
          GITHUB_TOKEN: ${{ secrets.NPM_PUBLISH_AUTOMATION_TOKEN }}

      # The dispatch above only proves the request was accepted; the publish happens in another
      # repo and never reports back. Without this the job goes green on a publish that never
      # landed, and release.yml gates the GitHub release on that green.
      - name: Wait for the registry to serve it
        run: |
          deadline=$((SECONDS + 600))
          for pkg in @parity/ppn-network-config @parity/ppn; do
            until curl -sfo /dev/null "https://registry.npmjs.org/$pkg/$VERSION"; do
              if [ "$SECONDS" -ge "$deadline" ]; then
                echo "::error::$pkg@$VERSION is not on the registry after 10 minutes."
                echo "Check the run in paritytech/npm_publish_automation." >&2
                exit 1
              fi
              sleep 15
            done
            echo "$pkg@$VERSION is live"
          done
