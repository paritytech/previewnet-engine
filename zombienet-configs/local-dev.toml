[settings]
timeout = 600
node_spawn_timeout = 240

# Elastic scaling: 2 extra cores for Asset Hub 2-second blocks
[relaychain.genesis.configuration.config.scheduler_params]
num_cores = 2
max_validators_per_core = 1

[relaychain]
chain = "paseo-local"
chain_spec_path = "{{BIN}}/relay_paseo.json"
default_command = "{{BIN}}/polkadot"
default_args = ["-lruntime=debug,xcm=trace", "--network-backend=libp2p", "--unsafe-rpc-external", "--rpc-max-response-size=50"]

[[relaychain.nodes]]
name = "alice-paseo-validator"
validator = true
rpc_port = 10000
p2p_port = 30334
balance = 1000000000000000

[[relaychain.nodes]]
name = "bob-paseo-validator"
validator = true
rpc_port = 10001
balance = 1000000000000000

[[relaychain.nodes]]
name = "charlie-paseo-validator"
validator = true
rpc_port = 10002
balance = 1000000000000000

[[relaychain.nodes]]
name = "dave-paseo-validator"
validator = true
rpc_port = 10003
balance = 1000000000000000

[[relaychain.nodes]]
name = "eve-paseo-validator"
validator = true
rpc_port = 10004
balance = 1000000000000000

[[relaychain.nodes]]
name = "ferdie-paseo-validator"
validator = true
rpc_port = 10005
balance = 1000000000000000

## Asset Hub Paseo Next (Parachain 1500) - Elastic Scaling with 2-second blocks
[[parachains]]
id = 1500
cumulus_based = true
chain = "asset-hub-local"
chain_spec_path = "{{BIN}}/asset_hub.json"

[[parachains.collators]]
name = "asset-hub-collator1"
rpc_port = 10020
p2p_port = 30335
command = "{{SCRIPTS}}/omni-node.sh"
args = ["-lxcm=trace", "--rpc-max-connections=500", "--force-authoring", "--authoring=slot-based", "--unsafe-rpc-external", "--rpc-max-response-size=50", "--experimental-webrtc", "--listen-addr=/ip4/127.0.0.1/udp/30335/webrtc-direct"]

## People Chain (Parachain 1502)
[[parachains]]
id = 1502
cumulus_based = true
chain = "individuality-local"
chain_spec_path = "{{BIN}}/individuality.json"

[[parachains.collators]]
name = "people-collator1"
rpc_port = 10010
p2p_port = 30336
command = "{{SCRIPTS}}/omni-node.sh"
args = ["-lparachain=debug,xcm=trace", "--rpc-max-connections=500", "--force-authoring", "--enable-statement-store", "--network-backend=libp2p", "--authoring=slot-based", "--unsafe-rpc-external", "--rpc-max-response-size=50"]

## Bulletin Chain (Parachain 1501)
[[parachains]]
id = 1501
cumulus_based = true
chain = "bulletin-local"
chain_spec_path = "{{BIN}}/bulletin.json"

[[parachains.collators]]
name = "bulletin-collator1"
rpc_port = 10030
p2p_port = 30333
command = "{{SCRIPTS}}/omni-node.sh"
args = ["-lparachain=debug,xcm=trace", "--rpc-max-connections=500", "--force-authoring", "--ipfs-server", "--authoring=slot-based", "--unsafe-rpc-external", "--rpc-max-response-size=50", "--experimental-webrtc", "--listen-addr=/ip4/127.0.0.1/udp/30333/webrtc-direct", "--enable-hop", "--hop-retention-secs=3600", "--hop-check-interval=60"]

## Web3 Storage Chain (Parachain 1600)
[[parachains]]
